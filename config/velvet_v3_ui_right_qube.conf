CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=7

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ZMK merges every matching shield-name-prefix conf file it finds, it doesn't
# stop at the first match (see zmk/app/keymap-module/modules/modules.cmake).
# "velvet_v3_ui_right" is a candidate prefix of this shield name too, so
# velvet_v3_ui_right.conf's CONFIG_ZMK_STATUS_ADVERTISEMENT=y still gets
# merged in unless explicitly overridden here, since this half is peripheral.
CONFIG_ZMK_STATUS_ADVERTISEMENT=n
